<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/images/logo-jnb.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080808" />
    <meta name="description" content="Jhon Noel Baculpo — Full-Stack Developer | Software Developer | IT Enthusiast. Building modern web applications, mobile experiences, and intelligent software solutions." />
    
    <!-- Open Graph / Meta -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Jhon Noel Baculpo | Full-Stack Developer" />
    <meta property="og:description" content="Building modern web applications, mobile experiences, and intelligent software solutions." />
    
    <!-- Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Early theme init script to prevent flash and ensure light/dark sync -->
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('jnb-portfolio-theme-mode') || localStorage.getItem('jnb-portfolio-theme');
          var isLight = mode === 'light' || (mode !== 'dark' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
          var root = document.documentElement;
          if (isLight) {
            root.classList.remove('dark');
            root.classList.add('light');
            root.setAttribute('data-theme', 'light');
          } else {
            root.classList.remove('light');
            root.classList.add('dark');
            root.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>

    <title>Jhon Noel Baculpo | Full-Stack Developer</title>
  </head>
  <body class="selection:bg-zinc-800 selection:text-zinc-100 antialiased overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
